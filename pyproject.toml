[project]
name = "spark-swe-eval"
version = "0.1.0"
description = "Execution-guided candidate selection for a local coding agent on SWE-bench Verified"
requires-python = ">=3.11"
dependencies = ["datasets>=3.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
spark-swe-eval = "spark_swe_eval.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
